name: pull_request_and_push_workflow

on:
  pull_request:
    branches:
      - "main"
  push:
  workflow_dispatch: 

jobs:
  build-project:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet: [ '8.0.x', '9.0.x', '10.0.x' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: restore
        run: dotnet restore
      - name: test
        run: dotnet test
      - name: build
        run: dotnet build TvSite.Presentation/TvSite.Presentation.csproj

  format-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: format-code
        run: dotnet format --verify-no-changes
  

      
  
 

  




